version: '3.8'

services:
  voting-api:
    container_name: voting-system-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
    restart: unless-stopped
    networks:
      - voting-network

networks:
  voting-network:
    driver: bridge
