version: '3.8'

services:
  express-api:
    container_name: library-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
    restart: unless-stopped
    networks:
      - library-network

networks:
  library-network:
    driver: bridge
